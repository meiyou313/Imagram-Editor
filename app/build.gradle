plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.imagram.editor'
    compileSdk 34

    defaultConfig {
        applicationId 'com.imagram.editor'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'

    // Photo editor engine (MIT) — brush, arrow/line shapes, text, filters, undo/redo.
    implementation 'com.burhanrashid52:photoeditor:3.1.1'
    // Crop engine (Apache 2.0) — CanHub fork of Android-Image-Cropper.
    implementation 'com.vanniktech:android-image-cropper:4.7.0'
}
