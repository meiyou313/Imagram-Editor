# Imagram Editor — Android CI (debug APK)
#
# Builds the debug APK with GitHub Actions (no local SDK needed).
# Triggers on push to main, pull requests, and manual dispatch.
# No signing, no release step: the APK is uploaded as a build
# artifact for testing (v0.1 is a debug build for the Samsung A54).
name: Imagram Editor Android (Debug)

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: List built APKs
        run: find app/build/outputs/apk -name '*.apk' -print

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: imagram-editor-v0.2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
